<text x="620" y="493" font-family="'Courier New',monospace" font-size="10" fill="#8b949e">📱 Mobile · Web · Brand</text>
<text x="620" y="509" font-family="'Courier New',monospace" font-size="10" fill="#4a5568">Craft</text>

<!-- Live dot -->
<circle cx="780" cy="489" r="5" fill="#00FF88">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="778" y="509" font-family="'Courier New',monospace" font-size="9" fill="#00FF88" text-anchor="middle">LIVE</text>

<!-- Corner accents -->
