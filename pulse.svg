<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#080c14"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="100%" stop-color="#0080FF"/>
  </linearGradient>
  <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#BF5FFF"/>
    <stop offset="100%" stop-color="#7928CA"/>
  </linearGradient>
  <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FF6B35"/>
    <stop offset="100%" stop-color="#FF0080"/>
  </linearGradient>
  <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF88"/>
    <stop offset="100%" stop-color="#00D4FF"/>
  </linearGradient>
  <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FFD700"/>
    <stop offset="100%" stop-color="#FF6B35"/>
  </linearGradient>
  <linearGradient id="pinkBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FF0080"/>
    <stop offset="100%" stop-color="#BF5FFF"/>
  </linearGradient>
  <!-- Card gradient -->
  <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1b2e"/>
    <stop offset="100%" stop-color="#080c14"/>
  </linearGradient>
  <!-- Glow filters -->
  <filter id="gCyan"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gPurple"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(0,212,255,0.06)"/>
  </pattern>

  <style>
    /* ── BORDER PULSE ── */
    .outer-border { animation: borderCycle 4s ease-in-out infinite; }
    @keyframes borderCycle {
      0%,100%{stroke:#00D4FF; filter:drop-shadow(0 0 8px #00D4FF);}
      33%     {stroke:#BF5FFF; filter:drop-shadow(0 0 8px #BF5FFF);}
      66%     {stroke:#FF6B35; filter:drop-shadow(0 0 8px #FF6B35);}
    }
    /* ── TITLE GLOW ── */
    .title { animation: titleGlow 3s ease-in-out infinite; }
    @keyframes titleGlow {
      0%,100%{fill:#00D4FF; filter:drop-shadow(0 0 6px #00D4FF);}
      50%     {fill:#BF5FFF; filter:drop-shadow(0 0 10px #BF5FFF);}
    }
    /* ── STAT CARD APPEAR ── */
    .c1{animation:slideUp .5s .2s both;}
    .c2{animation:slideUp .5s .4s both;}
    .c3{animation:slideUp .5s .6s both;}
    .c4{animation:slideUp .5s .8s both;}
    @keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── COUNTER NUMBERS ── */
    .n1{animation:countUp .8s 0.5s both;}
    .n2{animation:countUp .8s 0.7s both;}
    .n3{animation:countUp .8s 0.9s both;}
    .n4{animation:countUp .8s 1.1s both;}
    @keyframes countUp{from{opacity:0;font-size:0px}to{opacity:1;font-size:36px}}

    /* ── SKILL BARS ── */
    .bar-ts  {animation:growBar .9s 1.0s both;}
    .bar-react{animation:growBar .9s 1.2s both;}
    .bar-css {animation:growBar .9s 1.4s both;}
    .bar-js  {animation:growBar .9s 1.6s both;}
    .bar-html{animation:growBar .9s 1.8s both;}
    .bar-fire{animation:growBar .9s 2.0s both;}
    @keyframes growBar{from{width:0}to{}}

    /* ── SKILL LABEL FADE ── */
    .sl1{animation:fadeR .4s 1.0s both;}
    .sl2{animation:fadeR .4s 1.2s both;}
    .sl3{animation:fadeR .4s 1.4s both;}
    .sl4{animation:fadeR .4s 1.6s both;}
    .sl5{animation:fadeR .4s 1.8s both;}
    .sl6{animation:fadeR .4s 2.0s both;}
    @keyframes fadeR{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}

    /* ── GRAPH BARS ── */
    .gb{animation:growUp .6s both;}
    .gb:nth-child(1) {animation-delay:1.8s}
    .gb:nth-child(2) {animation-delay:1.85s}
    .gb:nth-child(3) {animation-delay:1.9s}
    .gb:nth-child(4) {animation-delay:1.95s}
    .gb:nth-child(5) {animation-delay:2.0s}
    .gb:nth-child(6) {animation-delay:2.05s}
    .gb:nth-child(7) {animation-delay:2.1s}
    .gb:nth-child(8) {animation-delay:2.15s}
    .gb:nth-child(9) {animation-delay:2.2s}
    .gb:nth-child(10){animation-delay:2.25s}
    .gb:nth-child(11){animation-delay:2.3s}
    .gb:nth-child(12){animation-delay:2.35s}
    @keyframes growUp{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}

    /* ── SECTION LABEL FADE ── */
    .sec{animation:fadeIn .5s 0.3s both;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* ── DIVIDER SLIDE ── */
    .divline{animation:slideRight 1s .1s both;}
    @keyframes slideRight{from{width:0}to{width:760px}}

    /* ── PING DOT ── */
    .ping{animation:pingPulse 1.5s ease-in-out infinite;}
    @keyframes pingPulse{0%,100%{opacity:1;r:4}50%{opacity:.4;r:6}}

    /* ── CARD BORDER HOVER EFFECT (color cycle) ── */
    .card-border-1{animation:cb1 6s ease-in-out infinite;}
    .card-border-2{animation:cb2 6s ease-in-out infinite;}
    .card-border-3{animation:cb3 6s ease-in-out infinite;}
    .card-border-4{animation:cb4 6s ease-in-out infinite;}
    @keyframes cb1{0%,100%{stroke:#00D4FF}50%{stroke:#BF5FFF}}
    @keyframes cb2{0%,100%{stroke:#BF5FFF}50%{stroke:#FF6B35}}
    @keyframes cb3{0%,100%{stroke:#FF6B35}50%{stroke:#FFD700}}
    @keyframes cb4{0%,100%{stroke:#00FF88}50%{stroke:#00D4FF}}
  </style>
</defs>

<!-- ── BG ── -->
<rect width="800" height="520" fill="url(#bg)" rx="14"/>
<rect width="800" height="520" fill="url(#dots)" rx="14" opacity="1"/>
<rect class="outer-border" x="2" y="2" width="796" height="516" rx="13" fill="none" stroke="#00D4FF" stroke-width="1.5"/>

<!-- ══════════════════════════════════════
     TITLE
════════════════════════════════════════ -->
<text class="title" x="400" y="42" font-family="'Courier New',monospace" font-size="20" font-weight="900"
      fill="#00D4FF" text-anchor="middle" letter-spacing="6">📊 GITHUB PULSE</text>
<rect class="divline" x="20" y="52" height="1" fill="url(#cyanBar)" rx="1"/>

<!-- ══════════════════════════════════════
     STAT CARDS  (row 1)
════════════════════════════════════════ -->
<!-- Card 1 — Repos -->
<g class="c1">
  <rect x="20" y="68" width="175" height="100" rx="10" fill="url(#card1)"/>
  <rect class="card-border-1" x="20" y="68" width="175" height="100" rx="10" fill="none" stroke="#00D4FF" stroke-width="1"/>
  <text x="107" y="104" font-family="'Courier New',monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="2">REPOSITORIES</text>
  <text class="n1" x="107" y="148" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#00D4FF" text-anchor="middle" filter="url(#gCyan)">9</text>
</g>

<!-- Card 2 — Projects -->
<g class="c2">
  <rect x="210" y="68" width="175" height="100" rx="10" fill="url(#card1)"/>
  <rect class="card-border-2" x="210" y="68" width="175" height="100" rx="10" fill="none" stroke="#BF5FFF" stroke-width="1"/>
  <text x="297" y="104" font-family="'Courier New',monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="2">PROJECTS</text>
  <text class="n2" x="297" y="148" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#BF5FFF" text-anchor="middle" filter="url(#gPurple)">6+</text>
</g>

<!-- Card 3 — Experience -->
<g class="c3">
  <rect x="400" y="68" width="175" height="100" rx="10" fill="url(#card1)"/>
  <rect class="card-border-3" x="400" y="68" width="175" height="100" rx="10" fill="none" stroke="#FF6B35" stroke-width="1"/>
  <text x="487" y="104" font-family="'Courier New',monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="2">EXPERIENCE</text>
  <text class="n3" x="487" y="148" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#FF6B35" text-anchor="middle">5+yr</text>
</g>

<!-- Card 4 — Status -->
<g class="c4">
  <rect x="590" y="68" width="190" height="100" rx="10" fill="url(#card1)"/>
  <rect class="card-border-4" x="590" y="68" width="190" height="100" rx="10" fill="none" stroke="#00FF88" stroke-width="1"/>
  <text x="685" y="104" font-family="'Courier New',monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="2">STATUS</text>
  <circle class="ping" cx="660" cy="138" r="4" fill="#00FF88"/>
  <text x="685" y="145" font-family="'Courier New',monospace" font-size="18" font-weight="900" fill="#00FF88" text-anchor="middle">BUILDING ⚡</text>
</g>

<!-- ══════════════════════════════════════
     SKILL BARS  (left column)
════════════════════════════════════════ -->
<text class="sec" x="20" y="200" font-family="'Courier New',monospace" font-size="11" fill="#8b949e" letter-spacing="3">TOP LANGUAGES &amp; TOOLS</text>

<!-- TypeScript -->
<g class="sl1">
  <text x="20" y="225" font-family="'Courier New',monospace" font-size="12" fill="#00D4FF">TypeScript</text>
  <text x="385" y="225" font-family="'Courier New',monospace" font-size="11" fill="#00D4FF" text-anchor="end">90%</text>
</g>
<rect x="20" y="230" width="370" height="8" rx="4" fill="#1a2233"/>
<rect class="bar-ts" x="20" y="230" width="333" height="8" rx="4" fill="url(#cyanBar)"/>

<!-- React -->
<g class="sl2">
  <text x="20" y="255" font-family="'Courier New',monospace" font-size="12" fill="#61DAFB">React</text>
  <text x="385" y="255" font-family="'Courier New',monospace" font-size="11" fill="#61DAFB" text-anchor="end">85%</text>
</g>
<rect x="20" y="260" width="370" height="8" rx="4" fill="#1a2233"/>
<rect class="bar-react" x="20" y="260" width="315" height="8" rx="4" fill="url(#greenBar)"/>

<!-- CSS / Tailwind -->
<g class="sl3">
  <text x="20" y="285" font-family="'Courier New',monospace" font-size="12" fill="#38B2AC">CSS / Tailwind</text>
  <text x="385" y="285" font-family="'Courier New',monospace" font-size="11" fill="#38B2AC" text-anchor="end">88%</text>
</g>
<rect x="20" y="290" width="370" height="8" rx="4" fill="#1a2233"/>
<rect class="bar-css" x="20" y="290" width="326" height="8" rx="4" fill="url(#purpleBar)"/>

<!-- JavaScript -->
<g class="sl4">
  <text x="20" y="315" font-family="'Courier New',monospace" font-size="12" fill="#FFD700">JavaScript</text>
  <text x="385" y="315" font-family="'Courier New',monospace" font-size="11" fill="#FFD700" text-anchor="end">82%</text>
</g>
<rect x="20" y="320" width="370" height="8" rx="4" fill="#1a2233"/>
<rect class="bar-js" x="20" y="320" width="304" height="8" rx="4" fill="url(#goldBar)"/>

<!-- Firebase -->
<g class="sl5">
  <text x="20" y="345" font-family="'Courier New',monospace" font-size="12" fill="#FF6B35">Firebase</text>
  <text x="385" y="345" font-family="'Courier New',monospace" font-size="11" fill="#FF6B35" text-anchor="end">78%</text>
</g>
<rect x="20" y="350" width="370" height="8" rx="4" fill="#1a2233"/>
<rect class="bar-fire" x="20" y="350" width="289" height="8" rx="4" fill="url(#orangeBar)"/>

<!-- UX/UI Design -->
<g class="sl6">
  <text x="20" y="375" font-family="'Courier New',monospace" font-size="12" fill="#FF0080">UX / UI Design</text>
  <text x="385" y="375" font-family="'Courier New',monospace" font-size="11" fill="#FF0080" text-anchor="end">95%</text>
</g>
<rect x="20" y="380" width="370" height="8" rx="4" fill="#1a2233"/>
<rect class="bar-html" x="20" y="380" width="352" height="8" rx="4" fill="url(#pinkBar)"/>

<!-- ══════════════════════════════════════
     COMMIT ACTIVITY GRAPH  (right column)
════════════════════════════════════════ -->
<text class="sec" x="420" y="200" font-family="'Courier New',monospace" font-size="11" fill="#8b949e" letter-spacing="3">COMMIT ACTIVITY</text>

<!-- Month labels -->
<text x="430" y="395" font-family="'Courier New',monospace" font-size="9" fill="#4a5568">JAN</text>
<text x="491" y="395" font-family="'Courier New',monospace" font-size="9" fill="#4a5568">FEB</text>
<text x="552" y="395" font-family="'Courier New',monospace" font-size="9" fill="#4a5568">MAR</text>
<text x="613" y="395" font-family="'Courier New',monospace" font-size="9" fill="#4a5568">APR</text>
<text x="674" y="395" font-family="'Courier New',monospace" font-size="9" fill="#4a5568">MAY</text>
<text x="735" y="395" font-family="'Courier New',monospace" font-size="9" fill="#4a5568">JUN</text>

<!-- Graph baseline -->
<line x1="420" y1="388" x2="780" y2="388" stroke="#1a2233" stroke-width="1"/>

<!-- Bars (transform-origin bottom) — heights represent commit intensity -->
<g transform="translate(0,388)" style="transform-box:fill-box">
  <!-- Jan group -->
  <rect class="gb" x="430" y="-55"  width="10" height="55"  rx="2" fill="#00D4FF" opacity="0.9" style="transform-origin:430px 0"/>
  <rect class="gb" x="444" y="-35"  width="10" height="35"  rx="2" fill="#00D4FF" opacity="0.6"/>
  <rect class="gb" x="458" y="-70"  width="10" height="70"  rx="2" fill="#00D4FF" opacity="0.8"/>
  <!-- Feb -->
  <rect class="gb" x="491" y="-45"  width="10" height="45"  rx="2" fill="#BF5FFF" opacity="0.9"/>
  <rect class="gb" x="505" y="-80"  width="10" height="80"  rx="2" fill="#BF5FFF" opacity="0.7"/>
  <rect class="gb" x="519" y="-60"  width="10" height="60"  rx="2" fill="#BF5FFF" opacity="0.8"/>
  <!-- Mar -->
  <rect class="gb" x="552" y="-90"  width="10" height="90"  rx="2" fill="#FF6B35" opacity="0.9"/>
  <rect class="gb" x="566" y="-50"  width="10" height="50"  rx="2" fill="#FF6B35" opacity="0.7"/>
  <rect class="gb" x="580" y="-110" width="10" height="110" rx="2" fill="#FF6B35" opacity="0.8"/>
  <!-- Apr -->
  <rect class="gb" x="613" y="-75"  width="10" height="75"  rx="2" fill="#FFD700" opacity="0.9"/>
  <rect class="gb" x="627" y="-95"  width="10" height="95"  rx="2" fill="#FFD700" opacity="0.7"/>
  <rect class="gb" x="641" y="-60"  width="10" height="60"  rx="2" fill="#FFD700" opacity="0.8"/>
  <!-- May -->
  <rect class="gb" x="674" y="-130" width="10" height="130" rx="2" fill="#00FF88" opacity="0.9"/>
  <rect class="gb" x="688" y="-85"  width="10" height="85"  rx="2" fill="#00FF88" opacity="0.7"/>
  <rect class="gb" x="702" y="-110" width="10" height="110" rx="2" fill="#00FF88" opacity="0.8"/>
  <!-- Jun -->
  <rect class="gb" x="735" y="-100" width="10" height="100" rx="2" fill="#FF0080" opacity="0.9"/>
  <rect class="gb" x="749" y="-70"  width="10" height="70"  rx="2" fill="#FF0080" opacity="0.7"/>
  <rect class="gb" x="763" y="-145" width="10" height="145" rx="2" fill="#FF0080" opacity="0.8"/>
</g>

<!-- ══════════════════════════════════════
     BOTTOM STATUS ROW
════════════════════════════════════════ -->
<rect x="2" y="462" width="796" height="56" rx="0" fill="#080c14" opacity="0.8"/>
<rect x="2" y="462" width="796" height="1" fill="url(#cyanBar)" opacity="0.4"/>
<rect x="2" y="516" width="796" height="2" fill="url(#purpleBar)" opacity="0.6" rx="14"/>

<!-- Bottom labels -->
<text x="30"  y="493" font-family="'Courier New',monospace" font-size="10" fill="#8b949e">🏢 Tech-X</text>
<text x="30"  y="509" font-family="'Courier New',monospace" font-size="10" fill="#4a5568">Company</text>

<text x="200" y="493" font-family="'Courier New',monospace" font-size="10" fill="#8b949e">🇹🇿 Tanzania</text>
<text x="200" y="509" font-family="'Courier New',monospace" font-size="10" fill="#4a5568">Location</text>

